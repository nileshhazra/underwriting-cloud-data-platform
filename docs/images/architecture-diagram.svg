<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%" style="background:#0a0f1d; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#50e6ff"/>
    </linearGradient>
    <linearGradient id="cosmosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c5bf0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41"/>
      <stop offset="50%" stop-color="#008272"/>
      <stop offset="100%" stop-color="#00b7c3"/>
    </linearGradient>
    <linearGradient id="pbiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c811"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowAzure" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="620" fill="url(#bgGrad)" />

  <!-- Grid Dots pattern -->
  <g opacity="0.12">
    <circle cx="40" cy="40" r="1.5" fill="#94a3b8"/><circle cx="120" cy="40" r="1.5" fill="#94a3b8"/><circle cx="200" cy="40" r="1.5" fill="#94a3b8"/><circle cx="280" cy="40" r="1.5" fill="#94a3b8"/><circle cx="360" cy="40" r="1.5" fill="#94a3b8"/><circle cx="440" cy="40" r="1.5" fill="#94a3b8"/><circle cx="520" cy="40" r="1.5" fill="#94a3b8"/><circle cx="600" cy="40" r="1.5" fill="#94a3b8"/><circle cx="680" cy="40" r="1.5" fill="#94a3b8"/><circle cx="760" cy="40" r="1.5" fill="#94a3b8"/><circle cx="840" cy="40" r="1.5" fill="#94a3b8"/><circle cx="920" cy="40" r="1.5" fill="#94a3b8"/><circle cx="1000" cy="40" r="1.5" fill="#94a3b8"/><circle cx="1080" cy="40" r="1.5" fill="#94a3b8"/><circle cx="1160" cy="40" r="1.5" fill="#94a3b8"/><circle cx="1240" cy="40" r="1.5" fill="#94a3b8"/>
    <circle cx="40" cy="120" r="1.5" fill="#94a3b8"/><circle cx="120" cy="120" r="1.5" fill="#94a3b8"/><circle cx="200" cy="120" r="1.5" fill="#94a3b8"/><circle cx="280" cy="120" r="1.5" fill="#94a3b8"/><circle cx="360" cy="120" r="1.5" fill="#94a3b8"/><circle cx="440" cy="120" r="1.5" fill="#94a3b8"/><circle cx="520" cy="120" r="1.5" fill="#94a3b8"/><circle cx="600" cy="120" r="1.5" fill="#94a3b8"/><circle cx="680" cy="120" r="1.5" fill="#94a3b8"/><circle cx="760" cy="120" r="1.5" fill="#94a3b8"/><circle cx="840" cy="120" r="1.5" fill="#94a3b8"/><circle cx="920" cy="120" r="1.5" fill="#94a3b8"/><circle cx="1000" cy="120" r="1.5" fill="#94a3b8"/><circle cx="1080" cy="120" r="1.5" fill="#94a3b8"/><circle cx="1160" cy="120" r="1.5" fill="#94a3b8"/><circle cx="1240" cy="120" r="1.5" fill="#94a3b8"/>
  </g>

  <!-- Title Header -->
  <text x="50" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">End-to-End Insurance Underwriting Architecture</text>
  <text x="50" y="74" fill="#94a3b8" font-size="13">Real-Time Event Streaming &bull; Azure Cloud &bull; Microsoft Fabric Medallion Architecture (Bronze / Silver / Gold) &bull; Power BI Direct Lake</text>

  <!-- ============================================================== -->
  <!-- ZONE 1: OPERATIONAL & INGESTION TIER                          -->
  <!-- ============================================================== -->
  <rect x="40" y="105" width="410" height="475" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5"/>
  <rect x="55" y="118" width="165" height="26" rx="6" fill="#1e293b"/>
  <text x="65" y="135" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">1. OPERATIONAL TIER</text>

  <!-- Card: React App -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="160" width="370" height="95" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <!-- React Icon -->
    <ellipse cx="98" cy="207" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.8" transform="rotate(30 98 207)"/>
    <ellipse cx="98" cy="207" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.8" transform="rotate(90 98 207)"/>
    <ellipse cx="98" cy="207" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.8" transform="rotate(150 98 207)"/>
    <circle cx="98" cy="207" r="3.5" fill="#00d8ff"/>
    <!-- Text -->
    <text x="130" y="193" fill="#f8fafc" font-size="15" font-weight="700">Underwriting Web Portal</text>
    <text x="130" y="212" fill="#38bdf8" font-size="12" font-weight="600">React 19 &bull; Vite &bull; Hosted on Vercel</text>
    <text x="130" y="232" fill="#94a3b8" font-size="11">Risk evaluation slider (1-100) &bull; Policy terms intake</text>
  </g>

  <!-- Arrow: React -> Node API -->
  <path d="M 245 255 L 245 285" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="274" fill="#38bdf8" font-size="10" font-weight="600">POST /api/policies</text>

  <!-- Card: Node.js Express Backend -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="295" width="370" height="95" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Node.js Icon -->
    <polygon points="98,327 114,336 114,354 98,363 82,354 82,336" fill="#339933"/>
    <text x="94" y="348" fill="#ffffff" font-size="11" font-weight="800">JS</text>
    <!-- Text -->
    <text x="130" y="328" fill="#f8fafc" font-size="15" font-weight="700">Policy Management API</text>
    <text x="130" y="347" fill="#818cf8" font-size="12" font-weight="600">Node.js Express &bull; Port 5050</text>
    <text x="130" y="367" fill="#94a3b8" font-size="11">ID generation (POL-YYYYMMDD-XXXX) &bull; Dual-dispatch</text>
  </g>

  <!-- Split Branching from Node.js -->
  <!-- Branch A: to Cosmos DB -->
  <path d="M 150 390 L 150 435" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Branch B: to Service Bus -->
  <path d="M 340 390 L 340 435" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Card: Azure Cosmos DB -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="445" width="175" height="115" rx="10" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
    <!-- Cosmos DB Icon -->
    <circle cx="85" cy="475" r="14" fill="#0078d4" opacity="0.3"/>
    <ellipse cx="85" cy="475" rx="12" ry="5" fill="none" stroke="#0078d4" stroke-width="1.5"/>
    <ellipse cx="85" cy="475" rx="12" ry="5" fill="none" stroke="#50e6ff" stroke-width="1.5" transform="rotate(60 85 475)"/>
    <ellipse cx="85" cy="475" rx="12" ry="5" fill="none" stroke="#00bcf2" stroke-width="1.5" transform="rotate(120 85 475)"/>
