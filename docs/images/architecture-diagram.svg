    <text x="108" y="489" fill="#60a5fa" font-size="10">NoSQL Serverless</text>
    <text x="72" y="520" fill="#94a3b8" font-size="10">OLTP Database</text>
    <text x="72" y="535" fill="#64748b" font-size="9.5">/policyType partition</text>
    <text x="72" y="548" fill="#34d399" font-size="9.5">● Connected ($0.00)</text>
  </g>

  <!-- Card: Azure Service Bus -->
  <g filter="url(#cardShadow)">
    <rect x="255" y="445" width="175" height="115" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Service Bus Icon -->
    <rect x="272" y="465" width="22" height="16" rx="3" fill="#f59e0b"/>
    <path d="M 272 468 L 283 475 L 294 468" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <text x="303" y="475" fill="#f8fafc" font-size="12" font-weight="700">Service Bus</text>
    <text x="303" y="489" fill="#fbbf24" font-size="10">Basic Tier Queue</text>
    <text x="268" y="520" fill="#94a3b8" font-size="10">Queue: policy-submissions</text>
    <text x="268" y="535" fill="#64748b" font-size="9.5">Decoupled streaming</text>
    <text x="268" y="548" fill="#34d399" font-size="9.5">● Active Trigger ($0.05)</text>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 2: SERVERLESS INGESTION PIPELINE                          -->
  <!-- ============================================================== -->
  <rect x="475" y="105" width="270" height="475" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5"/>
  <rect x="490" y="118" width="175" height="26" rx="6" fill="#1e293b"/>
  <text x="500" y="135" fill="#14b8a6" font-size="11" font-weight="700" letter-spacing="0.5">2. STREAMING INGESTION</text>

  <!-- Arrow: Service Bus -> Azure Function -->
  <path d="M 430 500 L 520 500 L 520 280 L 535 280" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="440" y="492" fill="#fbbf24" font-size="9.5" font-weight="600">Event Trigger</text>

  <!-- Card: Azure Function App -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="215" width="220" height="130" rx="12" fill="url(#cardGrad)" stroke="#0d9488" stroke-width="1.5"/>
    <!-- Azure Functions Icon -->
    <path d="M 525 240 L 540 240 L 530 260 L 545 260 L 520 285 L 527 265 L 518 265 Z" fill="#ffca00"/>
    <text x="555" y="250" fill="#f8fafc" font-size="14" font-weight="700">Azure Functions</text>
    <text x="555" y="267" fill="#2dd4bf" font-size="11" font-weight="600">Consumption Serverless</text>
    <text x="515" y="297" fill="#94a3b8" font-size="11">&bull; Service Bus Queue Trigger</text>
    <text x="515" y="314" fill="#94a3b8" font-size="11">&bull; Entra ID Service Principal</text>
    <text x="515" y="331" fill="#34d399" font-size="10.5">&bull; First 1M execs FREE ($0.00)</text>
  </g>

  <!-- Arrow: Function -> Bronze Lakehouse -->
  <path d="M 610 345 L 610 405" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="618" y="380" fill="#2dd4bf" font-size="10" font-weight="600">OneLake ADLS Gen2</text>

  <!-- Card: Bronze Lakehouse Landing -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="415" width="220" height="145" rx="12" fill="url(#cardGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="515" y="430" width="28" height="28" rx="6" fill="#431407"/>
    <text x="522" y="450" fill="#ea580c" font-size="16">🥉</text>
    <text x="552" y="442" fill="#f8fafc" font-size="13" font-weight="700">Bronze Lakehouse</text>
    <text x="552" y="457" fill="#fb923c" font-size="10.5">Raw JSON Audit Store</text>
    <text x="515" y="482" fill="#e2e8f0" font-size="10" font-family="monospace">Files/bronze/policies/</text>
    <text x="515" y="497" fill="#38bdf8" font-size="10" font-family="monospace">&boxur; year=YYYY/</text>
    <text x="527" y="512" fill="#38bdf8" font-size="10" font-family="monospace">&boxur; month=MM/</text>
    <text x="539" y="527" fill="#38bdf8" font-size="10" font-family="monospace">&boxur; day=DD/POL-*.json</text>
    <text x="515" y="547" fill="#94a3b8" font-size="9.5">Immutable Raw Files</text>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 3: MICROSOFT FABRIC MEDALLION & POWER BI                  -->
  <!-- ============================================================== -->
  <rect x="765" y="105" width="475" height="475" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5"/>
  <rect x="780" y="118" width="215" height="26" rx="6" fill="#1e293b"/>
  <text x="790" y="135" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="0.5">3. FABRIC MEDALLION &amp; BI</text>

  <!-- Arrow: Bronze -> Silver -->
  <path d="M 720 487 L 795 487 L 795 285 L 810 285" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="477" fill="#94a3b8" font-size="10" font-weight="600">PySpark Clean</text>

  <!-- Card: Silver Delta Table -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="215" width="200" height="135" rx="12" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="815" y="230" width="28" height="28" rx="6" fill="#334155"/>
    <text x="822" y="250" fill="#f1f5f9" font-size="16">🥈</text>
    <text x="852" y="242" fill="#f8fafc" font-size="13" font-weight="700">Silver Layer</text>
    <text x="852" y="257" fill="#cbd5e1" font-size="10.5">Delta Lake Table</text>
    <text x="815" y="283" fill="#38bdf8" font-size="11" font-weight="600">silver_policies</text>
    <text x="815" y="301" fill="#94a3b8" font-size="10">&bull; Flattened nested structs</text>
    <text x="815" y="317" fill="#94a3b8" font-size="10">&bull; Timestamp &amp; double casts</text>
    <text x="815" y="333" fill="#94a3b8" font-size="10">&bull; Deduplicated on policy_id</text>
  </g>

  <!-- Arrow: Silver -> Gold -->
  <path d="M 900 350 L 900 395" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="908" y="375" fill="#facc15" font-size="10" font-weight="600">PySpark Agg</text>

  <!-- Card: Gold Delta Tables -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="405" width="200" height="155" rx="12" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1.5"/>
    <rect x="815" y="420" width="28" height="28" rx="6" fill="#422006"/>
    <text x="822" y="440" fill="#fef08a" font-size="16">🥇</text>
    <text x="852" y="432" fill="#f8fafc" font-size="13" font-weight="700">Gold Layer</text>
    <text x="852" y="447" fill="#fef08a" font-size="10.5">Aggregated Business Data</text>
    <text x="815" y="473" fill="#fef08a" font-size="10.5" font-weight="600">&bull; gold_industry_risk_exposure</text>
    <text x="825" y="489" fill="#94a3b8" font-size="9.5">Premium, loss limits, risk</text>
    <text x="815" y="511" fill="#fef08a" font-size="10.5" font-weight="600">&bull; gold_underwriter_perf</text>
    <text x="825" y="527" fill="#94a3b8" font-size="9.5">Approval %, book size</text>
    <text x="815" y="547" fill="#34d399" font-size="9.5">Zero-calc lag on queries</text>
  </g>

  <!-- Arrow: Gold -> Power BI -->
  <path d="M 1000 480 L 1035 480" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="1002" y="472" fill="#fbbf24" font-size="9" font-weight="700">Direct Lake</text>

  <!-- Card: Power BI Executive Dashboard -->
  <g filter="url(#cardShadow)">
    <rect x="1045" y="215" width="180" height="345" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Power BI Icon -->
    <rect x="1065" y="235" width="10" height="28" rx="2" fill="#f2c811"/>
    <rect x="1079" y="243" width="10" height="20" rx="2" fill="#f59e0b"/>
    <rect x="1093" y="249" width="10" height="14" rx="2" fill="#e67e22"/>
    <text x="1112" y="248" fill="#f8fafc" font-size="13" font-weight="700">Power BI</text>
    <text x="1112" y="263" fill="#fbbf24" font-size="10">Direct Lake Mode</text>

    <!-- Mini Dashboard visual representation -->
    <rect x="1060" y="280" width="150" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="1070" y="297" fill="#94a3b8" font-size="9">Total Premium Written</text>
    <text x="1070" y="315" fill="#34d399" font-size="15" font-weight="800">$180.00K</text>

    <!-- Mini Chart 1: Bar -->
    <rect x="1060" y="332" width="150" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="1070" y="347" fill="#94a3b8" font-size="9">Premium by Industry</text>
    <rect x="1070" y="356" width="95" height="7" rx="2" fill="#0284c7"/>
    <rect x="1070" y="367" width="65" height="7" rx="2" fill="#38bdf8"/>
    <rect x="1070" y="378" width="50" height="7" rx="2" fill="#818cf8"/>
    <rect x="1070" y="389" width="40" height="7" rx="2" fill="#a78bfa"/>

    <!-- Mini Chart 2: Donut -->
    <rect x="1060" y="412" width="150" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="1070" y="427" fill="#94a3b8" font-size="9">Approval Distribution</text>
    <circle cx="1135" cy="452" r="14" fill="none" stroke="#34d399" stroke-width="6"/>
    <text x="1128" y="456" fill="#f8fafc" font-size="9" font-weight="700">100%</text>

    <!-- Semantic Model label -->
    <rect x="1060" y="487" width="150" height="60" rx="6" fill="#422006" stroke="#ca8a04"/>
    <text x="1068" y="503" fill="#fef08a" font-size="9.5" font-weight="700">sm_underwriting_analytics</text>
    <text x="1068" y="519" fill="#fef3c7" font-size="9">&bull; Sub-second VertiPaq</text>
    <text x="1068" y="534" fill="#fef3c7" font-size="9">&bull; Zero-copy Delta access</text>
  </g>
</svg>
